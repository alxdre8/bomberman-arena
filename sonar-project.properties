# ─────────────────────────────────────────────────────────────────────────────
# SonarCloud Configuration — Bomberman Arena
# ─────────────────────────────────────────────────────────────────────────────

# Organisation et projet (a adapter apres creation sur sonarcloud.io)
sonar.organization=alxdre8
sonar.projectKey=alxdre8_bomberman-arena
sonar.projectName=Bomberman Arena

# Sources a analyser
sonar.sources=backend/src,client/src
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.test.ts

# Exclusions (fichiers generes, deps, config)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/out/**,**/coverage/**

# Couverture (LCOV genere par Vitest)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Encodage
sonar.sourceEncoding=UTF-8
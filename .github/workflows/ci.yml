name: CI

on:
  push:
    branches: [main, develop, 'feat-*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Backend : Lint + Format + Typecheck + Tests + Couverture + Build
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    name: "Backend - Lint, Typecheck, Tests & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dependances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Verification du formatage (Prettier)
        run: npm run format:check

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Tests unitaires (Vitest)
        run: npm run test:unit

      - name: Tests d'integration (Vitest)
        run: npm run test:integration

      - name: Generation de la couverture (Vitest)
        run: npm run test:coverage

      - name: Build de verification
        run: npm run build

      - name: Upload rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Client : Lint + Typecheck + Build
  # ──────────────────────────────────────────────────────────────────────────
  client:
    name: "Client - Lint, Typecheck & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Installation des dependances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────────
  # SonarCloud : Analyse de qualite du code
  # ──────────────────────────────────────────────────────────────────────────
  sonarcloud:
    name: "SonarCloud - Code Quality"
    runs-on: ubuntu-latest
    needs: [backend, client]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Telecharger le rapport de couverture
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Backend : Lint + Typecheck + Tests + Couverture
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    name: "Backend - Lint, Typecheck & Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dependances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Verification du formatage (Prettier)
        run: npm run format:check

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Tests unitaires avec couverture (Vitest)
        run: npx vitest run --passWithNoTests --coverage --coverage.reporter=lcov --coverage.reportsDirectory=./coverage

      - name: Build de verification
        run: npm run build

      - name: Upload rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Client : Typecheck
  # ──────────────────────────────────────────────────────────────────────────
  client:
    name: "Client - Typecheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Installation des dependances
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  # ──────────────────────────────────────────────────────────────────────────
  # SonarCloud : Analyse de qualite du code
  # ──────────────────────────────────────────────────────────────────────────
  sonarcloud:
    name: "SonarCloud - Code Quality"
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Telecharger le rapport de couverture
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}